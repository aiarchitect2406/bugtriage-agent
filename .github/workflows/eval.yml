name: Agent Evaluation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  eval-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic opentelemetry-api pytest numpy fastapi

      - name: Authenticate to Google Cloud (For Evaluation)
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Validate Python Code Syntax
        run: |
          python -m py_compile $(find . -name "*.py")

      - name: Run Pytest Unit Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Agent Evaluation Harness against Golden Dataset
        run: |
          PYTHONPATH=. python3 tests/eval/run_eval.py

      - name: Validate Terraform IaC Configurations
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Format & Init Check
        run: |
          terraform fmt -check
          terraform init -backend=false
